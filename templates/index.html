<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Price Lookup</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    {% if logged_in %}<div class="topbar"><span></span><a class="logout-link" href="{{ url_for('logout') }}">Log out</a></div>{% endif %}
    <h1>Pokémon Card Price Lookup</h1>
    <div class="subtitle">Current lowest listings + recent sales from TCGPlayer, by condition.</div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form class="search-form" action="/search" method="get">
      <div>
        <label for="name">Card name (required)</label>
        <input type="text" id="name" name="name" placeholder="e.g. Charizard" value="{{ name or '' }}" required>
      </div>
      <div class="row2">
        <div>
          <label for="set_name">Set name</label>
          <input type="text" id="set_name" name="set_name" placeholder="e.g. Base Set" value="{{ set_name or '' }}">
        </div>
        <div>
          <label for="card_number">Card number</label>
          <input type="text" id="card_number" name="card_number" placeholder="e.g. 4/102" value="{{ card_number or '' }}">
        </div>
      </div>
      <div>
        <label for="holo_type">Holo / variant</label>
        <input type="text" id="holo_type" name="holo_type" placeholder="e.g. Holofoil, Reverse Holo" value="{{ holo_type or '' }}">
      </div>
      <div class="row2">
        <div>
          <label for="edition">Printing</label>
          <select id="edition" name="edition">
            {% for value, label in edition_choices %}
              <option value="{{ value }}" {% if value == edition %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div style="display:flex; align-items:flex-end;">
          <label class="check" for="holofoil">
            <input type="hidden" name="holofoil" value="0">
            <input type="checkbox" id="holofoil" name="holofoil" value="1" {% if holofoil %}checked{% endif %}>
            Holofoil
          </label>
        </div>
      </div>
      <button type="submit">Search</button>
    </form>
    <script>
      // Reverse is always holofoil, so the checkbox doesn't apply.
      const ed = document.getElementById("edition"), holo = document.getElementById("holofoil");
      function sync() { holo.disabled = (ed.value === "reverse" || ed.value === ""); }
      ed.addEventListener("change", sync); sync();
    </script>
  </div>
</body>
</html>
